[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zzz-calculator"
version = "0.1.0"
description = "Deterministic ZZZ combat domain model based on spec-v1"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "fastapi>=0.116,<1", "httpx>=0.27,<1"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[tool.setuptools.packages.find]
include = ["core*", "web*"]

[tool.setuptools.package-data]
"core.data.characters" = ["*.json"]
"core.data.wengines" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
