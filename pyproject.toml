[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zzz-calculator"
version = "2.1.0"
description = "Deterministic ZZZ combat domain model based on spec-v1"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "fastapi>=0.116,<1", "httpx>=0.27,<1", "genshin>=1.7.31,<2", "qrcode>=8.2,<9"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "genshin>=1.7.31,<2", "qrcode>=8.2,<9"]

[tool.setuptools.packages.find]
include = ["core*", "web*"]

[tool.setuptools.package-data]
"core.data.characters" = ["*.json"]
"core.data.wengines" = ["*.json"]
"core.data.drive_discs" = ["*.json"]
"core.data.enemies" = ["*.json"]
"core.data.endgame" = ["3.2/*.json", "3.2/boss/*.json", "3.2/shiyu/*.json"]
"core.application.endgame" = ["reviewed-evidence.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
